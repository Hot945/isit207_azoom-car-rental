<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZoom Staff Management Portal</title>
    <link rel="icon" type="image/svg+xml" href="images/logos/azoom-staff_favicon.svg">
    <link rel="apple-touch-icon" href="images/logos/azoom-staff_favicon.svg">
    <link rel="stylesheet" href="css/staff_style.css?v=126">
</head>
<body>

    <main class="md-login-screen" id="md-login-screen">
        <div class="md-login-card">
            <div class="md-login-header">
                <span class="md-brand-badge">AZoom Management Portal</span>
                <h1 class="md-login-title">Staff Sign In</h1>
            </div>

            <form class="md-form" id="md-login-form" novalidate>
                <div class="md-field" id="md-field-user">
                    <div class="md-input-wrap">
                        <input type="text" id="md-admin-user" class="md-input" placeholder=" " autocomplete="username" required>
                        <label for="md-admin-user" class="md-label">Username</label>
                    </div>
                </div>

                <div class="md-field" id="md-field-pass">
                    <div class="md-input-wrap has-trailing">
                        <input type="password" id="md-admin-pass" class="md-input" placeholder=" " autocomplete="current-password" required>
                        <label for="md-admin-pass" class="md-label">Password</label>
                        <button type="button" class="md-pwd-toggle" id="md-pwd-toggle" aria-label="Toggle password visibility">
                            <img src="images/eye-closed.svg" alt="" class="md-pwd-eye-icon" id="md-pwd-eye-icon" aria-hidden="true">
                        </button>
                    </div>
                </div>

                <div class="md-error-banner" id="md-login-error" role="alert">
                    Invalid administrator username or password.
                </div>

                <button type="submit" class="md-btn-primary">Sign In</button>
            </form>
        </div>

        <div class="md-default-cred-hint">
            <span>Default:</span>
            <span><code>admin</code> / <code>admin123</code></span>
        </div>
    </main>

    <div class="md-workspace-screen" id="md-workspace-screen">
        <header class="md-appbar">
            <div class="md-appbar-left">
                <button type="button" class="md-drawer-toggle" id="md-drawer-toggle" aria-label="Open Navigation Drawer" title="Open Navigation Drawer">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <span class="md-appbar-title">AZoom Staff Management Portal</span>
            </div>
            <div class="md-appbar-right">
                <span id="md-active-admin-label">Admin: admin</span>
                <button type="button" class="md-logout-btn" id="md-logout-btn">Sign Out</button>
            </div>
        </header>

        <div class="md-drawer-backdrop" id="md-drawer-backdrop" aria-hidden="true"></div>
        <aside class="md-nav-drawer" id="md-nav-drawer" aria-label="Main Navigation Drawer" aria-hidden="true">
            <div class="md-drawer-body">
                <div class="md-drawer-section">
                    <button type="button" class="md-drawer-item active" data-nav-module="reservation" id="drawer-nav-reservation">
                        <div class="md-drawer-item-left">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="md-drawer-item-icon">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                <line x1="16" y1="2" x2="16" y2="6"></line>
                                <line x1="8" y1="2" x2="8" y2="6"></line>
                                <line x1="3" y1="10" x2="21" y2="10"></line>
                            </svg>
                            <span>Reservation</span>
                        </div>
                        <span class="md-drawer-badge-count" id="drawer-res-count">0</span>
                    </button>
                    <button type="button" class="md-drawer-item" data-nav-module="feedback" id="drawer-nav-feedback">
                        <div class="md-drawer-item-left">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="md-drawer-item-icon">
                                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                            </svg>
                            <span>Feedback</span>
                        </div>
                        <span class="md-drawer-badge-count count-highlight" id="drawer-fb-count">0</span>
                    </button>
                </div>
            </div>
        </aside>

        <div class="md-workspace-layout">

            <aside class="md-sidebar" role="tablist" aria-label="Management Categories">
                <div class="md-sidebar-group" id="md-sidebar-group-reservation">
                    <div class="md-sidebar-group-header">
                        <span class="md-group-title">Reservations</span>
                    </div>
                    <button type="button" class="md-nav-item active" data-staff-tab="in_progress" role="tab" aria-selected="true">
                        <span class="md-nav-label">In Progress</span>
                        <span class="md-nav-count" id="count-in-progress">0</span>
                    </button>
                    <button type="button" class="md-nav-item" data-staff-tab="pending" role="tab" aria-selected="false">
                        <span class="md-nav-label">Pending</span>
                        <span class="md-nav-count" id="count-pending">0</span>
                    </button>
                    <button type="button" class="md-nav-item" data-staff-tab="completed" role="tab" aria-selected="false">
                        <span class="md-nav-label">Completed</span>
                        <span class="md-nav-count" id="count-completed">0</span>
                    </button>
                </div>

                <div class="md-sidebar-group" id="md-sidebar-group-feedback" style="display: none;">
                    <div class="md-sidebar-group-header">
                        <span class="md-group-title">Customer Feedback</span>
                    </div>
                    <button type="button" class="md-nav-item active" data-feedback-tab="unread" role="tab" aria-selected="true">
                        <span class="md-nav-label">Unread</span>
                        <span class="md-nav-count count-highlight" id="count-fb-unread">0</span>
                    </button>
                    <button type="button" class="md-nav-item" data-feedback-tab="read" role="tab" aria-selected="false">
                        <span class="md-nav-label">Read</span>
                        <span class="md-nav-count" id="count-fb-read">0</span>
                    </button>
                </div>
            </aside>

            <main class="md-content-area">
                <div id="md-bookings-container" class="md-bookings-container"></div>
                <div id="md-feedbacks-container" class="md-feedbacks-container" style="display: none;"></div>
            </main>
        </div>
    </div>

    <div id="md-snackbar" class="md-snackbar" role="status" aria-live="polite"></div>

    <script src="js/staff_app.js?v=127"></script>
</body>
</html>
